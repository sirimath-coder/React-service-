<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEV SCRP API - Professional</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Inter',system-ui;min-height:100vh;display:flex;justify-content:center;padding:24px}
.card{width:100%;max-width:780px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:28px;padding:32px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:.3}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-size:26px;font-weight:900;letter-spacing:-1px}
.logo span{background:#fff;color:#000;padding:2px 10px;border-radius:8px;margin-left:6px}
.badge{font-size:10px;letter-spacing:2px;background:#fff;color:#000;padding:6px 12px;border-radius:100px;font-weight:800}
.sub{color:#666;font-size:13px;margin-top:4px;letter-spacing:.5px}
.row{display:flex;gap:10px;background:#111;border:1px solid #1e1e1e;border-radius:16px;padding:6px;margin:14px 0;transition:.2s}
.row:focus-within{border-color:#fff;box-shadow:0 0 0 3px #ffffff10}
input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:12px 14px;font-family:'JetBrains Mono',monospace;font-size:13px}
.btn{background:#fff;color:#000;border:none;padding:11px 18px;border-radius:12px;font-weight:800;font-size:12px;letter-spacing:.5px;cursor:pointer;transition:.2s}
.btn:hover{background:#e5e5e5;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-outline{background:transparent;color:#fff;border:1px solid #2a2a2a}
.btn-outline:hover{background:#fff;color:#000;border-color:#fff}
.main{width:100%;padding:16px;background:#fff;color:#000;border:none;border-radius:16px;font-weight:900;font-size:14px;letter-spacing:.5px;cursor:pointer;transition:.2s;margin-top:8px}
.main:hover{background:#f0f0f0;letter-spacing:1px}
.divider{height:1px;background:linear-gradient(90deg,transparent,#1a1a1a,transparent);margin:22px 0}
.label{font-size:10px;letter-spacing:2px;color:#555;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.label::after{content:'';flex:1;height:1px;background:#1a1a1a}
.link{display:flex;gap:10px;background:#0f0f0f;border:1px solid #1e1e1e;border-radius:14px;padding:12px 14px;margin:8px 0;align-items:center;transition:.2s}
.link:hover{border-color:#333;background:#151515}
.link-url{flex:1;color:#aaa;font-family:'JetBrains Mono',monospace;font-size:11px;word-break:break-all;line-height:1.5}
pre{background:#080808;border:1px solid #151515;padding:16px;border-radius:16px;color:#777;font-family:'JetBrains Mono',monospace;font-size:11px;white-space:pre-wrap;max-height:420px;overflow:auto;line-height:1.6}
.status-dot{display:inline-block;width:6px;height:6px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div>
      <div class="logo">DEV<span>SCRP</span></div>
      <div class="sub"><span class="status-dot"></span> BYPASS ENGINE • NO KEY • PROFESSIONAL</div>
    </div>
    <div class="badge">V6 PRO</div>
  </div>

  <div class="label">TARGET URL</div>
  <div class="row">
    <input id="url" value="https://quick-react-rho.vercel.app/?v=2">
    <button class="btn" onclick="bypass()">BYPASS</button>
  </div>
  <button class="main" onclick="bypass()">⚡ BYPASS & GENERATE API → https://devapi-react-rho.vercel.app</button>

  <div class="divider"></div>

  <div class="label">GENERATED API LINKS</div>
  <div id="out"></div>
  <pre id="json">Ready to bypass...</pre>

  <div class="divider"></div>

  <div class="label">TRY API REQUEST</div>
  <div class="row">
    <input id="tryUrl" placeholder="Paste https://devapi-react-rho.vercel.app/api?...">
    <button class="btn" onclick="tryIt()">TRY</button>
  </div>
  <pre id="tryOut">Waiting for request...</pre>

  <div style="text-align:center;margin-top:20px;color:#333;font-size:10px;letter-spacing:2px">DEV SCRP API • BLACK & WHITE EDITION • 2026</div>
</div>

<script>
function copyFix(t,el){
  navigator.clipboard.writeText(t).then(()=>{
    const o=el.innerText; el.innerText='COPIED ✓'; el.style.background='#fff'; el.style.color='#000';
    setTimeout(()=>{el.innerText=o;},1300);
  }).catch(()=>{
    let ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    el.innerText='COPIED ✓';
  });
}
async function bypass(){
  const url=document.getElementById('url').value;
  const j=document.getElementById('json'); const out=document.getElementById('out');
  j.textContent='◐ Bypassing target...'; out.innerHTML='';
  try{
    const r=await fetch(`/api?url=${encodeURIComponent(url)}`);
    const d=await r.json();
    j.textContent=JSON.stringify(d,null,2);
    out.innerHTML=d.apis.map(a=>`
      <div class="link">
        <div class="link-url">${a}</div>
        <button class="btn" onclick="copyFix('${a}',this)">COPY</button>
        <button class="btn btn-outline" onclick="document.getElementById('tryUrl').value='${a}';tryIt()">TRY</button>
      </div>`).join('');
  }catch(e){ j.textContent='Error: '+e.message }
}
async function tryIt(){
  const u=document.getElementById('tryUrl').value; if(!u) return;
  const o=document.getElementById('tryOut'); o.textContent='◐ Requesting...';
  const r=await fetch(`/api?tryUrl=${encodeURIComponent(u)}`);
  const d=await r.json();
  o.textContent=JSON.stringify(d,null,2);
}
bypass();
</script>
</body>
</html>
